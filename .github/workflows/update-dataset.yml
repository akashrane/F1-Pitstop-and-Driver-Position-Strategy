name: Update F1 dataset

on:
  schedule:
    # Tuesday gives post-race corrections time to reach upstream sources.
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      start_year:
        description: First season to include
        required: true
        default: "1950"
      end_year:
        description: Last season to include (blank means current year)
        required: false
      refresh:
        description: Replace cached raw source snapshots
        type: boolean
        default: false
      publish_kaggle:
        description: Publish a new Kaggle dataset version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-f1-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      START_YEAR: ${{ inputs.start_year || '1950' }}
      END_YEAR: ${{ inputs.end_year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore immutable raw snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: f1-raw-${{ github.run_id }}
          restore-keys: f1-raw-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" kaggle
      - name: Resolve season range
        shell: bash
        run: echo "END_YEAR=${END_YEAR:-$(date -u +%Y)}" >> "$GITHUB_ENV"
      - name: Test pipeline
        run: python -m pytest -q
      - name: Build completed races
        id: build
        continue-on-error: true
        shell: bash
        run: |
          refresh=""
          if [[ "${{ inputs.refresh }}" == "true" ]]; then refresh="--refresh"; fi
          python scripts/build_seasons.py --start-year "$START_YEAR" --end-year "$END_YEAR" $refresh
      - name: Save raw snapshots for faster recovery
        if: ${{ always() && hashFiles('data/raw/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: f1-raw-${{ github.run_id }}
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: f1-build-diagnostics-${{ env.START_YEAR }}-${{ env.END_YEAR }}
          path: |
            data/processed/manifest_${{ env.START_YEAR }}_${{ env.END_YEAR }}.json
            data/processed/consolidated_${{ env.START_YEAR }}_${{ env.END_YEAR }}/
          if-no-files-found: warn
      - name: Validate publication files
        id: validation
        continue-on-error: true
        run: python scripts/validate_release.py "data/processed/manifest_${START_YEAR}_${END_YEAR}.json"
      - name: Download current Kaggle metadata
        if: ${{ steps.build.outcome == 'success' && steps.validation.outcome == 'success' }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_DATASET_SLUG: ${{ vars.KAGGLE_DATASET_SLUG || 'akashrane2609/formula-1-pit-stop-dataset' }}
        run: kaggle datasets metadata "$KAGGLE_DATASET_SLUG" --path release/current-metadata
      - name: Prepare release directory
        if: ${{ steps.build.outcome == 'success' && steps.validation.outcome == 'success' }}
        run: >-
          python scripts/prepare_kaggle_release.py
          --start-year "$START_YEAR"
          --end-year "$END_YEAR"
          --slug "${{ vars.KAGGLE_DATASET_SLUG || 'akashrane2609/formula-1-pit-stop-dataset' }}"
          --existing-metadata release/current-metadata/dataset-metadata.json
      - name: Upload validated dataset artifact
        if: ${{ steps.build.outcome == 'success' && steps.validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f1-strategy-data-${{ env.START_YEAR }}-${{ env.END_YEAR }}
          path: release/kaggle/
          if-no-files-found: error
      - name: Publish Kaggle version
        if: ${{ steps.build.outcome == 'success' && steps.validation.outcome == 'success' && (github.event_name == 'schedule' || inputs.publish_kaggle) }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_DATASET_SLUG: ${{ vars.KAGGLE_DATASET_SLUG || 'akashrane2609/formula-1-pit-stop-dataset' }}
        shell: bash
        run: |
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "KAGGLE_API_TOKEN is not configured" >&2
            exit 1
          fi
          echo "Kaggle CLI: $(kaggle --version)"
          echo "Publishing dataset: $KAGGLE_DATASET_SLUG"
          kaggle datasets status "$KAGGLE_DATASET_SLUG"
          kaggle datasets version \
            --path release/kaggle \
            --message "Automated verified update through ${END_YEAR} (${GITHUB_SHA::7})"
      - name: Enforce accuracy gate
        if: ${{ always() && (steps.build.outcome != 'success' || steps.validation.outcome != 'success') }}
        shell: bash
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}" >&2
          echo "Validation outcome: ${{ steps.validation.outcome }}" >&2
          echo "Kaggle publishing remains blocked. Download the diagnostics artifact for the manifest and partial tables." >&2
          exit 1
